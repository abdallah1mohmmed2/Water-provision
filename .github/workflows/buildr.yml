name: Build
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Install Linux SQLite development library
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev

      - name: Set up Java
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Cache Gradle wrapper and dependencies
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.9'
          cache: true

      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Test Shelf API runtime configuration
        working-directory: server
        run: |
          dart pub get
          dart analyze bin/inspect_schema.dart
          dart test

      - name: Test station Firebase build configuration
        run: python3 -m unittest discover -s tooling -p 'test_*.py'

      - name: Load station Firebase Android configuration
        run: python3 tooling/prepare_firebase_dart_defines.py

      - name: Analyze Flutter code
        run: flutter analyze

      - name: Run Flutter tests and collect coverage
        run: flutter test --coverage

      - name: Verify LCOV coverage report
        run: |
          test -s coverage/lcov.info
          grep -q '^DA:' coverage/lcov.info

      - name: Prepare Android NDK (retry corrupted downloads)
        shell: bash
        run: |
          set -euo pipefail
          NDK_VERSION="28.2.13676358"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          for attempt in 1 2 3; do
            echo "Installing Android NDK $NDK_VERSION (attempt $attempt/3)"
            rm -rf "$ANDROID_HOME/ndk/$NDK_VERSION"
            if "$SDKMANAGER" --install "ndk;$NDK_VERSION" && test -f "$ANDROID_HOME/ndk/$NDK_VERSION/source.properties"; then
              echo "NDK $NDK_VERSION is installed and verified."
              exit 0
            fi
            echo "NDK installation attempt $attempt failed; retrying with a clean package directory."
            sleep 5
          done
          echo "ERROR: NDK $NDK_VERSION could not be installed after 3 attempts."
          exit 1

      - name: Prepare SHA3-verified Android SQLite source
        run: python3 tooling/prepare_android_sqlite.py

      - name: Build Android APK
        run: |
          flutter build apk --debug \
            --dart-define=SAQIA_FIREBASE_API_KEY="$SAQIA_FIREBASE_API_KEY" \
            --dart-define=SAQIA_FIREBASE_APP_ID="$SAQIA_FIREBASE_APP_ID" \
            --dart-define=SAQIA_FIREBASE_MESSAGING_SENDER_ID="$SAQIA_FIREBASE_MESSAGING_SENDER_ID" \
            --dart-define=SAQIA_FIREBASE_PROJECT_ID="$SAQIA_FIREBASE_PROJECT_ID" \
            --dart-define=SAQIA_FIREBASE_STORAGE_BUCKET="$SAQIA_FIREBASE_STORAGE_BUCKET"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Saqia-App-Debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
