name: Flutter Analyze

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Install App dependencies (تجهيز التطبيق)
        run: flutter pub get
        
      - name: Install Server dependencies (تجهيز الخادم)
        working-directory: ./server
        run: dart pub get
        
      - name: Analyze ALL project source (الفحص الشامل لكل شيء)
        run: flutter analyze .
