name: Flutter Analyze

on:
  push:
    branches: [ "main", "master", "test/all-open-prs", "feature/firebase-station-foundation", "feature/complementary-changes", "feature/app-audio-system" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install Linux SQLite development library
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          
      - name: Install App dependencies (تجهيز التطبيق)
        run: flutter pub get
        
      - name: Install Server dependencies (تجهيز الخادم)
        working-directory: ./server
        run: dart pub get
        
      - name: Test Firebase activation gate
        run: flutter test test/firebase_access_gate_test.dart

      - name: Run audio feedback and local preference tests
        run: flutter test test/audio_feedback_service_test.dart test/audio_feedback_persistence_test.dart

      - name: Run accounting integration tests (اختبارات المحاسبة والتراجع)
        run: flutter test test/accounting_integration_test.dart

      - name: Run accounting calculation and balance unit tests (اختبارات الحسابات والأرصدة)
        run: flutter test test/calculations_test.dart test/general_account_balance_test.dart

      - name: Run saved message template tests (اختبارات قوالب الرسائل المحفوظة)
        run: flutter test test/message_template_service_test.dart

      - name: Run SQLite journal and rollback logic checks (فحص منطق SQLite والقيود العكسية)
        run: python3 tools/sql_logic_check.py

      - name: Analyze ALL project source (الفحص الشامل لكل شيء)
        run: flutter analyze --no-fatal-infos
