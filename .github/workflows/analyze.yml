name: Flutter Analyze

on:
  push:
    branches: [ "main", "master", "test/all-open-prs", "feature/beneficiary-in-app-login" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Install App dependencies (تجهيز التطبيق)
        run: flutter pub get
        
      - name: Run beneficiary local authentication tests (اختبارات دخول المستفيد)
        run: flutter test test/services/local_beneficiary_auth_service_test.dart

      - name: Run beneficiary portal ownership tests (اختبارات ملكية بوابة المستفيد)
        run: flutter test test/beneficiary_portal_repository_test.dart

      - name: Install Server dependencies (تجهيز الخادم)
        working-directory: ./server
        run: dart pub get
        
      - name: Run accounting integration tests (اختبارات المحاسبة والتراجع)
        run: flutter test test/accounting_integration_test.dart

      - name: Run accounting calculation and balance unit tests (اختبارات الحسابات والأرصدة)
        run: flutter test test/calculations_test.dart test/general_account_balance_test.dart

      - name: Run saved message template tests (اختبارات قوالب الرسائل المحفوظة)
        run: flutter test test/message_template_service_test.dart

      - name: Run SQLite journal and rollback logic checks (فحص منطق SQLite والقيود العكسية)
        run: python3 tools/sql_logic_check.py

      - name: Analyze ALL project source (الفحص الشامل لكل شيء)
        run: flutter analyze .
