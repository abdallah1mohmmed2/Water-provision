name: Build Flutter APK

on:
  push:
    branches: [ "test/all-open-prs" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: جلب الكود المصدري
        uses: actions/checkout@v4

      - name: إعداد بيئة Java مع التخزين المؤقت
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle' # يحفظ أدوات بناء الأندرويد لتسريعها في المرات القادمة

      - name: إعداد بيئة Flutter مع التخزين المؤقت
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true # يحفظ بيئة فلاتر بالكامل لتجنب إعادة تحميلها

      - name: جلب الحزم والمكتبات
        run: flutter pub get

      - name: بناء تطبيق الأندرويد (النسخة النهائية)
        run: flutter build apk --release

      - name: حفظ ملف الـ APK لتمكين تحميله
        uses: actions/upload-artifact@v4
        with:
          name: Saqia-App-Release
          path: build/app/outputs/flutter-apk/app-release.apk
