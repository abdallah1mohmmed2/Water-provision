name: Build Flutter APK

on:
  push:
    branches: [ "test/all-open-prs", "experiment/main-based-2026-11-02", "feature/firebase-station-foundation", "feature/unified-theme-system", "feature/complementary-changes" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: جلب الكود المصدري
        uses: actions/checkout@v4
      - name: Install Linux SQLite development library
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev

      - name: إعداد بيئة Java مع التخزين المؤقت
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Cache Gradle wrapper and dependencies
        uses: gradle/actions/setup-gradle@v4

      - name: إعداد بيئة Flutter مع التخزين المؤقت
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true

      - name: جلب الحزم والمكتبات
        run: flutter pub get

      - name: تجهيز واختبار خادم المزامنة
        working-directory: ./server
        run: |
          dart pub get
          dart analyze
          dart test

      - name: Test station Firebase build configuration
        run: python3 -m unittest discover -s tooling -p 'test_*.py'

      - name: Load station Firebase Android configuration
        run: python3 tooling/prepare_firebase_dart_defines.py

      - name: تحليل Flutter
        # Match the repository's validated CI policy: info-level lints are non-fatal,
        # while analyzer errors and warnings still fail the release build.
        run: flutter analyze --no-fatal-infos

      - name: اختبارات Flutter
        run: flutter test

      - name: تجهيز Android NDK مع إعادة المحاولة عند تلف التنزيل
        shell: bash
        run: |
          set -euo pipefail
          NDK_VERSION="28.2.13676358"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          for attempt in 1 2 3; do
            echo "Installing Android NDK $NDK_VERSION (attempt $attempt/3)"
            rm -rf "$ANDROID_HOME/ndk/$NDK_VERSION"
            if "$SDKMANAGER" --install "ndk;$NDK_VERSION" && test -f "$ANDROID_HOME/ndk/$NDK_VERSION/source.properties"; then
              echo "NDK $NDK_VERSION is installed and verified."
              exit 0
            fi
            echo "NDK installation attempt $attempt failed; retrying with a clean package directory."
            sleep 5
          done
          echo "ERROR: NDK $NDK_VERSION could not be installed after 3 attempts."
          exit 1

      - name: Prepare SHA3-verified Android SQLite source
        run: python3 tooling/prepare_android_sqlite.py

      - name: بناء تطبيق الأندرويد (Release)
        run: |
          flutter build apk --release \
            --dart-define=SAQIA_FIREBASE_API_KEY="$SAQIA_FIREBASE_API_KEY" \
            --dart-define=SAQIA_FIREBASE_APP_ID="$SAQIA_FIREBASE_APP_ID" \
            --dart-define=SAQIA_FIREBASE_MESSAGING_SENDER_ID="$SAQIA_FIREBASE_MESSAGING_SENDER_ID" \
            --dart-define=SAQIA_FIREBASE_PROJECT_ID="$SAQIA_FIREBASE_PROJECT_ID" \
            --dart-define=SAQIA_FIREBASE_STORAGE_BUCKET="$SAQIA_FIREBASE_STORAGE_BUCKET"

      - name: ضغط APK والتحقق من سلامة الملف
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          mkdir -p dist
          zip -9 -j dist/Saqia-App-Release.zip "$APK"
          sha256sum dist/Saqia-App-Release.zip > dist/Saqia-App-Release.zip.sha256
          unzip -t dist/Saqia-App-Release.zip
          ls -lh "$APK" dist/Saqia-App-Release.zip dist/Saqia-App-Release.zip.sha256

      - name: رفع نسخة Release المضغوطة كـ Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Saqia-App-Release-ZIP
          path: |
            dist/Saqia-App-Release.zip
            dist/Saqia-App-Release.zip.sha256
          if-no-files-found: error
          compression-level: 0

  publish-public-release:
    needs: build
    if: ${{ github.ref == 'refs/heads/feature/complementary-changes' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download release package
        uses: actions/download-artifact@v4
        with:
          name: Saqia-App-Release-ZIP
          path: dist

      - name: Verify checksum
        run: |
          set -euo pipefail
          test -s dist/Saqia-App-Release.zip
          test -s dist/Saqia-App-Release.zip.sha256
          sha256sum -c dist/Saqia-App-Release.zip.sha256

      - name: Publish public prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          SHORT_SHA="${SHA:0:12}"
          TAG="complementary-${SHORT_SHA}"
          gh release create "$TAG" dist/Saqia-App-Release.zip dist/Saqia-App-Release.zip.sha256 \
            --repo "${{ github.repository }}" \
            --title "Saqia Complementary Branch - ${SHORT_SHA}" \
            --prerelease \
            --notes "Public Android APK for feature/complementary-changes. Built from commit ${SHA}. Download the ZIP, extract, and install the APK. SHA-256 checksum is attached."
