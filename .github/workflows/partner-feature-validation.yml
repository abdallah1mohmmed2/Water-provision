name: Partner Feature Validation

on:
  push:
    branches:
      - feature/partner-in-app
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    name: Analyze, test, and build partner release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Flutter Analyze
        run: flutter analyze

      - name: Flutter Tests
        run: flutter test

      - name: Prepare Android NDK with download retry
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          fi
          if [ -z "${SDKMANAGER:-}" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "Android sdkmanager was not found under $SDK_ROOT"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          for attempt in 1 2 3; do
            if "$SDKMANAGER" --install "ndk;28.2.13676358"; then
              break
            fi
            rm -rf "$SDK_ROOT/ndk/28.2.13676358"
            if [ "$attempt" -eq 3 ]; then
              echo "NDK 28.2.13676358 installation failed after 3 attempts"
              exit 1
            fi
            sleep "$((attempt * 15))"
          done
          test -f "$SDK_ROOT/ndk/28.2.13676358/source.properties"

      - name: Build Android release APK
        run: flutter build apk --release

      - name: Upload partner release APK
        uses: actions/upload-artifact@v4
        with:
          name: partner-feature-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
